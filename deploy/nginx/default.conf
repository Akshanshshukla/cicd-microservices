server {
    listen 8080;
    server_name _;
    location = /health { default_type application/json; return 200 '{"status":"ok","service":"gateway"}'; }
    location /api/orders { proxy_pass http://127.0.0.1:8000/api/orders; }
    location /api/catalog { proxy_pass http://127.0.0.1:8001/api/catalog; }
}
